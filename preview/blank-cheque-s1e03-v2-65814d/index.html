  const a=bgms[f.id]; if(a){ fade(f.id,0,.6); setTimeout(()=>a.pause(),650); }
  $('panel').classList.remove('holding'); hold=null; phase='play'; sync(true); if(resume){ main.play().catch(()=>{}); } setIcons(); }
function holdTick(now){ if(!hold) return; const dt=(now-hold.last)/1000; hold.last=now; if(hold.paused) return; hold.left-=dt; hold.used+=dt;
  $('ringFg').style.strokeDashoffset=RC*(1-Math.max(0,hold.left)/hold.total); if(hold.left<=0) exitHold(true); }

// transport
function play(){ if(phase==='hold'){ hold.paused=false; hold.last=performance.now(); const b=holdBase(hold.f); b.play().catch(()=>{}); const a=bgms[hold.f.id]; a&&a.play().catch(()=>{}); fade(hold.f.id,1,.3); } else main.play().catch(()=>{}); setIcons(); }
function pause(){ if(phase==='hold'){ hold.paused=true; holdBase(hold.f).pause(); const a=bgms[hold.f.id]; if(a){ fade(hold.f.id,0,.2); setTimeout(()=>{ if(hold&&hold.paused) a.pause(); },250); } } else main.pause(); setIcons(); }
function toggle(){ const playing=phase==='hold'?!hold.paused:!main.paused; playing?pause():play(); pulse(!playing); }
function setMute(m){ muted=m; main.muted=m; Object.keys(bgms).forEach(k=>{ if(hold&&hold.f.id===k) fade(k,m?0:1,.15); }); setIcons(); }
function seek(t){ if(phase==='hold') exitHold(false); t=Math.max(0,Math.min(DUR-0.05,t)); FL.forEach(f=>{ if(t<f.t1-0.05) held[f.id]=false; }); main.currentTime=t; sync(true); }

function start(fromTop){ audioInit(); if(ctx&&ctx.state==='suspended') ctx.resume(); $('cover').hidden=true; phase='play'; started=true; if(fromTop){ FL.forEach(f=>held[f.id]=false); main.currentTime=0; } main.muted=muted; main.play().catch(()=>{}); setIcons(); }
function cover(kind){ const c=$('cover'); const choices=FL.map(f=>{ const v=f.v.find(x=>x.id===choice[f.id]); return `<li><b>${fmt(f.t0)}</b>${esc(f.short)}: ${esc(v.hidden?'as filmed':v.label)}</li>`; }).join('');
  $('cvEyebrow').textContent=CFG.eyebrow; $('cvTitle').textContent=kind==='end'?'That was Episode 3':CFG.title;
  $('cvText').textContent=kind==='end'?'Your picks are below. Watch again to try a different look.':CFG.logline;
  $('cvList').innerHTML=kind==='start'?FL.map(f=>`<li><b>${fmt(f.t0)}</b>${esc(f.short)}</li>`).join(''):choices;
  const B=$('cvBtns'); B.innerHTML='';
  const mkb=(label,icon,cls,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='big'+(cls?' '+cls:''); b.innerHTML=icon+label; b.onclick=fn; B.appendChild(b); return b; };
  if(kind==='start') mkb('Play episode',BIG_PLAY,'',()=>start(false)).focus?.();
  else if(kind==='closed'){ mkb('Resume',BIG_PLAY,'',()=>start(false)); mkb('Start over',BIG_RE,'ghost',()=>start(true)); }
  else mkb('Watch again',BIG_RE,'',()=>start(true));
  c.hidden=false; phase=kind==='start'?'cover':'closed'; }
function close(){ if(phase==='hold') exitHold(false); main.pause(); sync(true); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); try{ parent.postMessage({type:'flicks:close'},'*'); }catch(e){} cover('closed'); setIcons(); }

// events
$('tap').onclick=()=>{ if(phase!=='cover'&&phase!=='closed') toggle(); };
$('bPlay').onclick=()=>toggle();
$('bMute').onclick=()=>setMute(!muted);
$('bClose').onclick=close;
$('go').onclick=e=>{ e.stopPropagation(); exitHold(true); };
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(!fsOK) $('bFs').hidden=true;
$('bFs').onclick=()=>{ const el=document.documentElement; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else (el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?.())?.catch?.(()=>toast('Full screen is not available here')); };
const prog=$('prog'); const posT=e=>{ const r=prog.getBoundingClientRect(); return (Math.min(Math.max(e.clientX-r.left,0),r.width)/r.width)*DUR; };
prog.addEventListener('pointerdown',e=>{ e.stopPropagation(); prog.setPointerCapture(e.pointerId); seek(posT(e)); const mv=ev=>seek(posT(ev)); prog.addEventListener('pointermove',mv); prog.addEventListener('pointerup',()=>prog.removeEventListener('pointermove',mv),{once:true}); });
prog.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){seek(main.currentTime+5);e.preventDefault();} if(e.key==='ArrowLeft'){seek(main.currentTime-5);e.preventDefault();} });
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('button,a,[role=slider]')&&e.code==='Space') return; if(e.code==='Space'&&phase!=='cover'&&phase!=='closed'){ e.preventDefault(); toggle(); } if(e.key==='m') setMute(!muted); });
main.addEventListener('play',()=>{ sync(true); setIcons(); }); main.addEventListener('pause',()=>{ sync(true); setIcons(); }); main.addEventListener('seeked',()=>sync(true));
main.addEventListener('ended',()=>{ if(phase==='play') cover('end'); });

// frame loop
function frame(now){ const t=phase==='hold'?hold.f.t1:main.currentTime;
  $('time').textContent=fmt(t)+' / '+fmt(DUR); const p=t/DUR*100; $('fl').style.width=p+'%'; $('kn').style.left=p+'%';
  if(phase==='play'||phase==='hold'){
    warmAround(t); FL.forEach(f=>{ if(f.hold&&t>f.t1-10&&t<f.t1+0.5) warmHold(f); });
    const f=phase==='hold'?hold.f:FL.find(x=>t>=x.t0&&t<x.t1);
    if(f!==active){ active=f; if(f){ build(f); $('panel').classList.add('show'); } else $('panel').classList.remove('show'); setAd(f); }
    if(phase==='play'&&!main.paused){ const g=FL.find(x=>!held[x.id]&&x.hold&&t>=x.t1-0.06&&t<x.t1+0.6); if(g) enterHold(g); }
  }
  if(phase==='hold'){ holdTick(now); }
  if(phase==='hold'&&hold){ const L=holdList(); syncList(L,hold.paused,false); draw(L.map(x=>x.v)); }
  else if(started){ draw(sync(false)||[]); }
  requestAnimationFrame(frame); }
cover('start'); setIcons(); requestAnimationFrame(frame);
window.__fp={layers:()=>(phase==='hold'&&hold?holdList().map(x=>x.v):(sync(false)||[])).map(v=>v.dataset.src.split('/').pop()),get t(){return main.currentTime},get phase(){return phase},choice,seek,pick:(fid,id)=>pick(FL.find(f=>f.id===fid),id),get hold(){return hold&&{f:hold.f.id,left:hold.left}}};
})();
</script>
