 {clip:()=>'F4_'+st.l2},{clip:()=>'S5_'+st.l2},{flick:5},
 {clip:()=>'F5_'+st.gift},{clip:()=>endingKey()},{end:1}]}
function endingKey(){const L=st.l2;if(st.gift==='PHONE')return 'FREED_'+L;if(st.gift==='CONF')return 'TRUTH_'+L;return 'VOICE_'+L+'L'}
let SEQ=steps(),idx=-1,holdTimer=null,holding=false,paused=false,started=false;
const keyOf=s=>typeof s.clip==='function'?s.clip():s.clip;
const url=k=>'media/'+k+'.mp4';
// overlays per clip
function CARDS(k){const c=[];const L=k.slice(-1);
 const call=(who,n,t0,t1)=>c.push({t0,t1,h:`<div class="av g">${who[0]}</div><div><div class="t1">${who} calling…</div><div class="t2">${n}</div></div><div class="pulse"></div>`});
 if(k==='E1S1'){c.push({t0:5.6,t1:8.1,h:`<div class="av">M</div><div><div class="t1">Meera</div><div class="t2">online · typing…</div></div>`});c.push({t0:6.6,t1:8.1,h:`<div class="av">M</div><div style="flex:1"><div class="t1">Voice note · 0:04</div><div class="wave">${'<i></i>'.repeat(14)}</div></div>`})}
 if(k.startsWith('F1_'))c.push({t0:1.6,t1:5.2,h:`<div class="av">M</div><div style="flex:1"><div class="t1">Meera · voice note</div><div class="wave">${'<i></i>'.repeat(14)}</div></div>`});
 if(k==='F2_PHONE')c.push({t0:4.4,t1:6.6,h:`<div class="av r">!</div><div><div class="t1">Recent call · Ajay · 14 min</div><div class="t2">3:41 AM — the night she died</div></div>`});
 if(k==='F2_PHOTO')c.push({t0:4.4,t1:6.6,h:`<div class="av">B</div><div><div class="t1">On the back, in faded ink</div><div class="t2">Bela, 1968</div></div>`});
 if(k==='F2_PAYAL')c.push({t0:4.6,t1:6.6,h:`<div class="av">♪</div><div><div class="t1">It chimes once</div><div class="t2">though nothing moved it</div></div>`});
 if(k.startsWith('S3_')){c.push({t0:0.2,t1:2.8,h:`<div class="av">M</div><div><div class="t1">Meera shared Live Location</div><div class="t2">Prinsep Ghat · 4:44 AM</div></div>`});call('Meera','Call 2 of 3 · she never picks… you do',3.0,10.5)}
 if(k.startsWith('S5_'))call('Meera','Call 3 of 3',6.0,11);
 if(k.startsWith('TRUTH_')){const m={T:["Posted to meera.das's story","Tara's confession · 2M views by noon"],A:['3:44 AM video + confession','Posted together · not deleted'],D:["Playing at Meera's shraddh",'From every phone in the hall']}[L];c.push({t0:1.0,t1:8.4,h:`<div class="av r">●</div><div><div class="t1">${m[0]}</div><div class="t2">${m[1]}</div></div>`})}
 if(k==='VOICE_TL')call('Tara','Tara is asleep in the next room',3.2,9);
 if(k==='VOICE_AL')call('Ajay','Ajay is asleep on the divan',3.2,9);
 if(k==='VOICE_DL')call('Dida','From the puja room, where Dida sits silent',3.2,9);
 if(k==='FREED_T')c.push({t0:6.2,t1:8.8,h:`<div class="av">M</div><div><div class="t1">Meera</div><div class="t2">last seen 13 days ago</div></div>`});
 return c}
let rafId=0;
function tick(){const k=cur.dataset.k;const t=cur.currentTime;if(k){
 const cs=CARDS(k).filter(c=>t>=c.t0&&t<c.t1);const box=$('#cards');const sig=cs.map(c=>c.h).join('|');if(box.dataset.sig!==sig){box.dataset.sig=sig;box.innerHTML=cs.map(c=>`<div class="card">${c.h}</div>`).join('')}
 const sub=(CLIPS[k]||{subs:[]}).subs.find(s=>t>=s.t&&t<s.t+s.d);const el=$('#subs');
 if(sub&&!holding){el.hidden=false;el.className=sub.who==='meera'?'meera':'';el.querySelector('.hi').textContent=sub.hi;el.querySelector('.en').textContent=sub.en}else el.hidden=true}
 rafId=requestAnimationFrame(tick)}
// audio bed
let AC,bedGain,bedSrc,bedBuf;
async function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();bedGain=AC.createGain();bedGain.gain.value=0;bedGain.connect(AC.destination);const r=await fetch('media/drone.mp3');bedBuf=await AC.decodeAudioData(await r.arrayBuffer());bedSrc=AC.createBufferSource();bedSrc.buffer=bedBuf;bedSrc.loop=true;bedSrc.connect(bedGain);bedSrc.start();bed(0.16,2)}catch(e){}}
function bed(v,s){if(!AC)return;const g=bedGain.gain;g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(g.value,AC.currentTime);g.linearRampToValueAtTime(muted?0:v,AC.currentTime+s)}
let stingBuf;async function sting(){if(!AC||muted)return;try{if(!stingBuf){const r=await fetch('media/stinger.mp3');stingBuf=await AC.decodeAudioData(await r.arrayBuffer())}const s=AC.createBufferSource();s.buffer=stingBuf;const g=AC.createGain();g.gain.value=.5;s.connect(g).connect(AC.destination);s.start()}catch(e){}}
let muted=false;
// playback
function prepare(k){if(!k)return;if(nxt.dataset.k===k)return;nxt.dataset.k=k;nxt.src=url(k);nxt.load()}
function playKey(k,after){const el=(nxt.dataset.k===k)?nxt:nxt;if(el.dataset.k!==k){el.dataset.k=k;el.src=url(k);el.load()}
 el.muted=muted;el.currentTime=0;const go=()=>{el.classList.add('on');el.classList.remove('hold');cur.classList.remove('on','hold');const old=cur;cur=el;nxt=old;setTimeout(()=>{try{old.pause()}catch(e){}},150);after&&after()};
 el.onplaying=()=>{el.onplaying=null;go()};el.onended=onEnded;const p=el.play();if(p)p.catch(()=>{});}
function onEnded(){if(this!==cur)return;advance()}
function peekNextKey(){const s=SEQ[idx+1];if(s&&s.clip)return keyOf(s);return null}
function advance(){idx++;const s=SEQ[idx];if(!s)return;
 if(s.clip){const k=keyOf(s);playKey(k,()=>{if(s.title)showTitle(s.title);bed(s.clip==='E1S1'||/^O_/.test(k)?0.14:0.09,1.5);const n=peekNextKey();if(n)setTimeout(()=>prepare(n),600)})}
 else if(s.flick)showFlick(s.flick);
 else if(s.ep1end)ep1End();else if(s.end)finalEnd()}
function showTitle(t){const d=document.createElement('div');d.id='title';d.innerHTML=`<div class="e">${t[0]}</div><div class="n">${t[1]}</div><div class="s">${t[2]}</div>`;$('#frame').appendChild(d);setTimeout(()=>d.remove(),3500)}
function showFlick(n){const F=FL[n];holding=true;$('#subs').hidden=true;cur.classList.add('hold');bed(0.3,1.2);sting();
 $('#q .k').textContent=F.k;$('#q h2').textContent=F.q;const rail=$('#rail');rail.innerHTML='';const opts=F.opts();
 opts.forEach(([o,label],i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');b.innerHTML=`<img src="thumbs/${F.thumb(o)}.jpg" alt=""><span>${label}</span>`;b.setAttribute('aria-label',label);b.onclick=e=>{e.stopPropagation();choose(n,o)};b.onmouseenter=()=>{rail.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};rail.appendChild(b)});
 $('#hold').hidden=false;
 // preload first option
 const s=SEQ[idx+1];F.set(opts[0][0]);prepare(keyOf(s));F.set(null);
 const bar=$('#timer i');bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;bar.style.transition='transform 12s linear';bar.style.transform='scaleX(0)';
 clearTimeout(holdTimer);holdTimer=setTimeout(()=>{const sel=[...rail.querySelectorAll('.opt')].findIndex(x=>x.classList.contains('sel'));choose(n,opts[Math.max(0,sel)][0])},12000)}
function choose(n,o){if(!holding)return;clearTimeout(holdTimer);holding=false;FL[n].set(o);$('#hold').hidden=true;bed(0.09,1);advance()}
function ep1End(){const c=$('#card');c.hidden=false;c.innerHTML=`<div class="eyebrow">End of Episode 1</div><p class="quote" style="margin-top:14px">“Teen baar bulati hai. Do baar tum sun chuke ho.”<small>It calls three times. You've heard two.</small></p><button class="btn" id="bEp2"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Episode 2</button>`;cur.classList.remove('on');bed(0.2,1.5);
 const go=()=>{clearTimeout(t);c.hidden=true;advance()};const t=setTimeout(go,9000);$('#bEp2').onclick=e=>{e.stopPropagation();go()};const n=peekNextKey();if(n)prepare(n)}
function finalEnd(){const e=ENDCARD[st.gift];const c=$('#card');c.hidden=false;cur.classList.remove('on');bed(0.22,2);
 c.innerHTML=`<div class="eyebrow">Ending · ${e[0]}</div><p class="quote" style="margin-top:14px">“${e[1]}”<small>${e[2]}</small></p><div class="recap">Your night: <b>${NAME[st.l1]}</b> answered first · the tank gave <b>${({PHONE:"Meera's phone",PHOTO:"Bela's photo",PAYAL:"the payal"})[st.obj]}</b> · <b>${NAME[st.fig]}</b> stood behind · <b>${NAME[st.l2]}</b> walked in · gave <b>${({PHONE:"Meera's phone",CONF:'a confession',THREAD:'the thread'})[st.gift]}</b></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn" id="bAgain">Watch again</button><button class="btn ghost" id="bHome">Close</button></div>`;
 $('#bAgain').onclick=e=>{e.stopPropagation();restart(true)};$('#bHome').onclick=e=>{e.stopPropagation();closeAll()}}
function restart(play){Object.keys(st).forEach(k=>st[k]=null);SEQ=steps();idx=-1;$('#card').hidden=true;$('#hold').hidden=true;holding=false;clearTimeout(holdTimer);[vA,vB].forEach(v=>{v.pause();v.classList.remove('on','hold');v.removeAttribute('src');v.dataset.k='';v.load()});if(play)advance()}
function closeAll(){restart(false);$('#cover').hidden=false;$('#ctl').hidden=true;bed(0,0.8);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('#bStart').onclick=async e=>{e.stopPropagation();$('#cover').hidden=true;$('#ctl').hidden=false;if(!AC)await initAudio();else{AC.resume();bed(0.14,1.5)}
 [vA,vB].forEach(v=>{v.muted=true;const p=v.play();if(p)p.catch(()=>{});v.pause();v.muted=muted});
 if(!started){started=true;requestAnimationFrame(tick)}restart(true)};
$('#tap').onclick=()=>{if(holding||!$('#card').hidden)return;if(cur.paused){cur.play();paused=false;$('#pauseInd').hidden=true;AC&&AC.resume()}else{cur.pause();paused=true;$('#pauseInd').hidden=false;AC&&AC.suspend()}};
$('#bMute').onclick=e=>{e.stopPropagation();muted=!muted;[vA,vB].forEach(v=>v.muted=muted);$('#mw').style.display=muted?'none':'';bed(muted?0:(holding?0.3:0.09),0.3);$('#bMute').setAttribute('aria-label',muted?'Unmute':'Mute')};
$('#bFs').onclick=e=>{e.stopPropagation();const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else (el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():null)};
$('#bClose').onclick=e=>{e.stopPropagation();closeAll()};
document.addEventListener('keydown',e=>{if(e.key===' '&&!holding){e.preventDefault();$('#tap').click()}});
</script>
