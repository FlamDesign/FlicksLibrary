// audio graph for smooth music fades
const gains={};
function audioInit(){ if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); Object.entries(bgms).forEach(([k,a])=>{ const s=ctx.createMediaElementSource(a); const g=ctx.createGain(); g.gain.value=0; s.connect(g).connect(ctx.destination); gains[k]=g; }); }catch(e){ ctx=null; } }
function fade(k,to,sec){ const a=bgms[k]; if(!a) return; const g=gains[k]; if(ctx&&g){ const n=ctx.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value,n); g.gain.linearRampToValueAtTime(muted?0:to,n+sec); } else { a.volume=muted?0:to; } }

// icons + ui
function setIcons(){ const playing=phase==='hold'?!hold.paused:!main.paused; $('icPlay').innerHTML=playing?IC.pause:IC.play; $('bPlay').setAttribute('aria-label',playing?'Pause':'Play'); $('icMute').innerHTML=muted?IC.muted:IC.vol; $('bMute').setAttribute('aria-label',muted?'Unmute':'Mute'); }
function pulse(play){ const p=$('pulse'); $('pulseIc').innerHTML=play?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>'; p.classList.add('go2'); clearTimeout(p._t); p._t=setTimeout(()=>p.classList.remove('go2'),550); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }
function setAd(f){ const ad=$('ad'); if(!f||!f.ad){ ad.classList.remove('show'); return; } const v=f.v.find(x=>x.id===choice[f.id]); const sel=v&&!v.hidden;
  $('adLogo').src=f.ad.logo; $('adLogo').alt=f.ad.brand+' logo'; $('adBrand').textContent=f.ad.brand;
  $('adName').textContent=sel?v.prod:f.ad.idle; $('adPrice').innerHTML=sel?`${esc(v.price)}${v.mrp?`<s>${esc(v.mrp)}</s>`:''}${v.off?`<b>${esc(v.off)}</b>`:''}`:esc(f.ad.idle2||'');
  const c=$('adCta'); c.textContent=sel?f.ad.cta:f.ad.cta_idle; c.href=sel?v.url:f.ad.url; ad.classList.add('show'); }
function build(f){ $('tag').textContent=f.ad?'Ad · tap to try on':'Flick'; $('q').textContent=f.q; $('sp').textContent=f.ad?('Sponsored by '+f.ad.brand):''; const ths=$('ths'); ths.innerHTML='';
  f.v.filter(v=>!v.hidden).forEach(v=>{ const o=document.createElement('div'); o.className='opt';
    const b=document.createElement('button'); b.type='button'; b.className='th'+(choice[f.id]===v.id?' sel':''); b.dataset.v=v.id; b.setAttribute('aria-pressed',choice[f.id]===v.id); b.setAttribute('aria-label','Try '+v.label);
    b.innerHTML=`<img src="${esc(v.thumb)}" alt=""><span>${esc(v.label)}</span>`; b.onclick=e=>{ e.stopPropagation(); pick(f,v.id); };
    const a=document.createElement('a'); a.className='buy'; a.href=v.url; a.target='_blank'; a.rel='noopener'; a.innerHTML=`Buy <b>${esc(v.price)}</b>`; a.setAttribute('aria-label',`Buy ${v.prod} for ${v.price}`);
    o.append(b,a); ths.appendChild(o); }); }
function pick(f,id){ if(choice[f.id]===id) id=(f.v.find(x=>x.hidden)||{}).id||id; choice[f.id]=id;
  $('ths').querySelectorAll('.th').forEach(b=>{ const on=b.dataset.v===id; b.classList.toggle('sel',on); b.setAttribute('aria-pressed',on); });
  setAd(f); if(f.persist && id!=='A') toast(f.persist); if(phase==='hold'){ showHoldClip(); extend(); } sync(true); }

// overlay sync
function sync(force){ const t=main.currentTime; FL.forEach(f=>f.v.forEach(v=>{ const el=ovs[f.id+v.id]; if(!el) return;
  const want=choice[f.id]===v.id && t>=f.t0-0.02 && t<(f.vend||f.t1);
  if(want){ warm(el); const target=t-f.t0; if(force||Math.abs(el.currentTime-target)>0.12){ try{el.currentTime=Math.max(0,target);}catch(e){} }
    if(main.paused){ if(!el.paused) el.pause(); } else if(el.paused) el.play().catch(()=>{});
    if(el.readyState>=2) el.classList.add('on'); else el.addEventListener('loadeddata',()=>{ if(choice[f.id]===v.id) el.classList.add('on'); },{once:true}); }
  else { el.classList.remove('on'); if(!el.paused) el.pause(); } })); }

// hold ("take your time") beat
const RC=2*Math.PI*11; $('ringFg').style.strokeDasharray=RC;
function showHoldClip(){ if(!hold) return; const f=hold.f; Object.entries(holds).forEach(([k,el])=>{ if(!k.startsWith(f.id)) return; const on=k===f.id+choice[f.id]; if(on){ warm(el); if(!hold.paused) el.play().catch(()=>{}); el.classList.add('on'); } else { el.classList.remove('on'); setTimeout(()=>{ if(!el.classList.contains('on')) el.pause(); },400); } }); }
function enterHold(f){ held[f.id]=true; main.pause(); try{ main.currentTime=f.t1; }catch(e){}
  hold={f,left:f.hold.base,total:f.hold.base,used:0,paused:false,last:performance.now()}; phase='hold';
  $('panel').classList.add('holding'); $('holdTxt').textContent=f.hold.text; $('tag').textContent=f.ad?'Ad · take your time':'Flick'; showHoldClip();
  const a=bgms[f.id]; if(a){ audioInit(); try{a.currentTime=0;}catch(e){} a.play().catch(()=>{}); fade(f.id,1,.25); }
  sync(true); setIcons(); }
function extend(){ if(!hold) return; const room=hold.f.hold.max-hold.used; hold.left=Math.min(Math.max(hold.left,hold.f.hold.extend),room); hold.total=Math.max(hold.left,1); }
function exitHold(resume){ if(!hold) return; const f=hold.f; Object.entries(holds).forEach(([k,el])=>{ if(k.startsWith(f.id)){ el.classList.remove('on'); setTimeout(()=>el.pause(),400); } });
  const a=bgms[f.id]; if(a){ fade(f.id,0,.6); setTimeout(()=>a.pause(),650); }
  $('panel').classList.remove('holding'); hold=null; phase='play'; if(resume){ main.play().catch(()=>{}); } setIcons(); }
function holdTick(now){ if(!hold) return; const dt=(now-hold.last)/1000; hold.last=now; if(hold.paused) return; hold.left-=dt; hold.used+=dt;
  $('ringFg').style.strokeDashoffset=RC*(1-Math.max(0,hold.left)/hold.total); if(hold.left<=0) exitHold(true); }

// transport
function play(){ if(phase==='hold'){ hold.paused=false; hold.last=performance.now(); const el=holds[hold.f.id+choice[hold.f.id]]; el&&el.play().catch(()=>{}); const a=bgms[hold.f.id]; a&&a.play().catch(()=>{}); fade(hold.f.id,1,.3); } else main.play().catch(()=>{}); setIcons(); }
function pause(){ if(phase==='hold'){ hold.paused=true; const el=holds[hold.f.id+choice[hold.f.id]]; el&&el.pause(); const a=bgms[hold.f.id]; if(a){ fade(hold.f.id,0,.2); setTimeout(()=>{ if(hold&&hold.paused) a.pause(); },250); } } else main.pause(); setIcons(); }
function toggle(){ const playing=phase==='hold'?!hold.paused:!main.paused; playing?pause():play(); pulse(!playing); }
function setMute(m){ muted=m; main.muted=m; Object.keys(bgms).forEach(k=>{ if(hold&&hold.f.id===k) fade(k,m?0:1,.15); }); setIcons(); }
function seek(t){ if(phase==='hold') exitHold(false); t=Math.max(0,Math.min(DUR-0.05,t)); FL.forEach(f=>{ if(t<f.t1-0.05) held[f.id]=false; }); main.currentTime=t; sync(true); }

function start(fromTop){ audioInit(); if(ctx&&ctx.state==='suspended') ctx.resume(); $('cover').hidden=true; phase='play'; started=true; if(fromTop){ FL.forEach(f=>held[f.id]=false); main.currentTime=0; } main.muted=muted; main.play().catch(()=>{}); setIcons(); }
function cover(kind){ const c=$('cover'); const choices=FL.map(f=>{ const v=f.v.find(x=>x.id===choice[f.id]); return `<li><b>${fmt(f.t0)}</b>${esc(f.short)}: ${esc(v.hidden?'as filmed':v.label)}</li>`; }).join('');
  $('cvEyebrow').textContent=CFG.eyebrow; $('cvTitle').textContent=kind==='end'?'That was Episode 3':CFG.title;
  $('cvText').textContent=kind==='end'?'Your picks are below. Watch again to try a different look.':CFG.logline;
  $('cvList').innerHTML=kind==='start'?FL.map(f=>`<li><b>${fmt(f.t0)}</b>${esc(f.short)}</li>`).join(''):choices;
  const B=$('cvBtns'); B.innerHTML='';
  const mkb=(label,icon,cls,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='big'+(cls?' '+cls:''); b.innerHTML=icon+label; b.onclick=fn; B.appendChild(b); return b; };
  if(kind==='start') mkb('Play episode',BIG_PLAY,'',()=>start(false)).focus?.();
  else if(kind==='closed'){ mkb('Resume',BIG_PLAY,'',()=>start(false)); mkb('Start over',BIG_RE,'ghost',()=>start(true)); }
  else mkb('Watch again',BIG_RE,'',()=>start(true));
  c.hidden=false; phase=kind==='start'?'cover':'closed'; }
function close(){ if(phase==='hold') exitHold(false); main.pause(); sync(true); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); try{ parent.postMessage({type:'flicks:close'},'*'); }catch(e){} cover('closed'); setIcons(); }

// events
$('tap').onclick=()=>{ if(phase!=='cover'&&phase!=='closed') toggle(); };
$('bPlay').onclick=()=>toggle();
$('bMute').onclick=()=>setMute(!muted);
$('bClose').onclick=close;
$('go').onclick=e=>{ e.stopPropagation(); exitHold(true); };
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(!fsOK) $('bFs').hidden=true;
$('bFs').onclick=()=>{ const el=document.documentElement; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else (el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?.())?.catch?.(()=>toast('Full screen is not available here')); };
const prog=$('prog'); const posT=e=>{ const r=prog.getBoundingClientRect(); return (Math.min(Math.max(e.clientX-r.left,0),r.width)/r.width)*DUR; };
prog.addEventListener('pointerdown',e=>{ e.stopPropagation(); prog.setPointerCapture(e.pointerId); seek(posT(e)); const mv=ev=>seek(posT(ev)); prog.addEventListener('pointermove',mv); prog.addEventListener('pointerup',()=>prog.removeEventListener('pointermove',mv),{once:true}); });
prog.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){seek(main.currentTime+5);e.preventDefault();} if(e.key==='ArrowLeft'){seek(main.currentTime-5);e.preventDefault();} });
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('button,a,[role=slider]')&&e.code==='Space') return; if(e.code==='Space'&&phase!=='cover'&&phase!=='closed'){ e.preventDefault(); toggle(); } if(e.key==='m') setMute(!muted); });
main.addEventListener('play',()=>{ sync(true); setIcons(); }); main.addEventListener('pause',()=>{ sync(true); setIcons(); }); main.addEventListener('seeked',()=>sync(true));
main.addEventListener('ended',()=>{ if(phase==='play') cover('end'); });

// frame loop
function frame(now){ const t=phase==='hold'?hold.f.t1:main.currentTime;
  $('time').textContent=fmt(t)+' / '+fmt(DUR); const p=t/DUR*100; $('fl').style.width=p+'%'; $('kn').style.left=p+'%';
  if(phase==='play'||phase==='hold'){
    FL.forEach(f=>{ if(t>f.t0-12&&t<(f.vend||f.t1)) warmFlick(f); });
    const f=phase==='hold'?hold.f:FL.find(x=>t>=x.t0&&t<x.t1);
    if(f!==active){ active=f; if(f){ build(f); $('panel').classList.add('show'); } else $('panel').classList.remove('show'); setAd(f); }
    if(phase==='play'&&!main.paused){ const g=FL.find(x=>!held[x.id]&&x.hold&&t>=x.t1-0.06&&t<x.t1+0.6); if(g) enterHold(g); else sync(false); }
    if(phase==='hold') holdTick(now);
  }
  requestAnimationFrame(frame); }
cover('start'); setIcons(); requestAnimationFrame(frame);
window.__fp={get t(){return main.currentTime},get phase(){return phase},choice,seek,pick:(fid,id)=>pick(FL.find(f=>f.id===fid),id),get hold(){return hold&&{f:hold.f.id,left:hold.left}}};
})();
</script>
